<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格華茲：AI 命運織路者</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="capacitor.js"></script>
    
    <style>
        :root {
            --color-bg: #0d0c12;
            --color-gold: #c5a880;
            --color-gold-bright: #f3e5ab;
            --color-parchment: #dcd1b4;
            --color-panel-bg: rgba(23, 20, 31, 0.9);
            --color-border: #4a3f35;
            --color-disabled: #554d42;
            --color-magic-purple: #3b2d54;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(197, 168, 128, 0.08), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(98, 0, 234, 0.05), transparent 50%);
            color: var(--color-parchment);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* 優化：預留頂部 Navbar 高度，防止內容被遮擋 */
            padding-top: 60px; 
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(197,168,128,0.3)"/></svg>');
            opacity: 0.6;
            animation: bgShift 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        /* 頂部全域狀態列優化（僅留兩個按鈕區塊） */
        .global-navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 55px;
            background: rgba(13, 12, 18, 0.95);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.8);
            display: none;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-gold-bright);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links { display: flex; gap: 24px; font-size: 0.9rem; }
        .nav-item { color: var(--color-parchment); text-decoration: none; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; gap: 6px; }
        .nav-item:hover:not(.disabled) { color: var(--color-gold-bright); }
        .nav-item.disabled { color: var(--color-disabled); cursor: not-allowed; pointer-events: none; }

        /* 容器基本結構 */
        .game-stage {
            display: none;
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 650px;
            background: var(--color-panel-bg);
            border: 2px solid var(--color-border);
            border-radius: 4px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(197, 168, 128, 0.1);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease forwards;
        }

        .game-stage.active { display: block; }

        .game-stage::before, .game-stage::after {
            content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--color-gold); pointer-events: none;
        }
        .game-stage::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .game-stage::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }

        /* 標題與基礎樣式 */
        .header-section { text-align: center; margin-bottom: 25px; }
        .game-title { font-family: 'Cinzel', serif; font-size: 1.9rem; font-weight: 700; color: var(--color-gold-bright); letter-spacing: 3px; text-shadow: 0 0 12px rgba(243, 229, 171, 0.4); margin-bottom: 6px; }
        .game-subtitle { font-size: 0.9rem; color: #8c8275; letter-spacing: 1px; }
        .divider { display: flex; align-items: center; justify-content: center; margin: 15px 0; }
        .divider::before, .divider::after { content: ""; height: 1px; width: 60px; background: linear-gradient(to right, transparent, var(--color-border), transparent); }
        .divider i { color: var(--color-gold); margin: 0 15px; font-size: 0.8rem; }

        /* 模式與自訂選擇區域 */
        .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 25px; }
        .mode-card { background: rgba(35, 30, 45, 0.6); border: 1px solid #3a322a; border-radius: 6px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .mode-card:hover { border-color: var(--color-gold); background: rgba(45, 38, 58, 0.8); }
        .mode-card.active { border-color: var(--color-gold-bright); background: rgba(197, 168, 128, 0.12); box-shadow: 0 0 15px rgba(197, 168, 128, 0.2); }
        .mode-card i { font-size: 1.6rem; color: var(--color-gold); margin-bottom: 10px; }
        .mode-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; color: #fff; }
        .mode-desc { font-size: 0.78rem; color: #9e9282; line-height: 1.4; }

        .config-content-wrapper { min-height: 100px; margin-bottom: 25px; }
        .config-panel { display: none; }
        .config-panel.active { display: block; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 12px; color: #615649; }
        .magic-input { width: 100%; background: #16131c; border: 1px solid var(--color-border); border-radius: 4px; padding: 12px 12px 12px 38px; color: #fff; font-family: monospace; font-size: 0.95rem; outline: none; }
        
        .status-box { border-radius: 4px; padding: 15px; font-size: 0.85rem; line-height: 1.5; display: flex; align-items: flex-start; gap: 12px; }
        .status-success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; }
        .status-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; }

        /* 按鈕樣式 */
        .btn-submit { width: 100%; background: linear-gradient(135deg, #a8895f 0%, #735a38 100%); border: 1px solid var(--color-gold); color: #fff; padding: 14px; font-size: 1.05rem; font-weight: 600; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing:
