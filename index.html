<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格華茲：AI 命運織路者</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="capacitor.js"></script>
    
    <style>
        :root {
            --color-bg: #0d0c12;
            --color-gold: #c5a880;
            --color-gold-bright: #f3e5ab;
            --color-parchment: #dcd1b4;
            --color-panel-bg: rgba(23, 20, 31, 0.9);
            --color-border: #4a3f35;
            --color-disabled: #554d42;
            --color-magic-purple: #3b2d54;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(197, 168, 128, 0.08), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(98, 0, 234, 0.05), transparent 50%);
            color: var(--color-parchment);
            font-family: 'Noto Serif TC', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding-top: 60px; 
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(197,168,128,0.3)"/></svg>');
            opacity: 0.6;
            animation: bgShift 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        .global-navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 55px;
            background: rgba(13, 12, 18, 0.95);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.8);
            display: none;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-gold-bright);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links { display: flex; gap: 24px; font-size: 0.9rem; }
        .nav-item { color: var(--color-parchment); text-decoration: none; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; gap: 6px; }
        .nav-item:hover:not(.disabled) { color: var(--color-gold-bright); }
        .nav-item.disabled { color: var(--color-disabled); cursor: not-allowed; pointer-events: none; }

        .game-stage {
            display: none;
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 650px;
            background: var(--color-panel-bg);
            border: 2px solid var(--color-border);
            border-radius: 4px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(197, 168, 128, 0.1);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease forwards;
        }

        .game-stage.active { display: block; }

        .game-stage::before, .game-stage::after {
            content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--color-gold); pointer-events: none;
        }
        .game-stage::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .game-stage::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }

        .header-section { text-align: center; margin-bottom: 25px; }
        .game-title { font-family: 'Cinzel', serif; font-size: 1.9rem; font-weight: 700; color: var(--color-gold-bright); letter-spacing: 3px; text-shadow: 0 0 12px rgba(243, 229, 171, 0.4); margin-bottom: 6px; }
        .game-subtitle { font-size: 0.9rem; color: #8c8275; letter-spacing: 1px; }
        .divider { display: flex; align-items: center; justify-content: center; margin: 15px 0; }
        .divider::before, .divider::after { content: ""; height: 1px; width: 60px; background: linear-gradient(to right, transparent, var(--color-border), transparent); }
        .divider i { color: var(--color-gold); margin: 0 15px; font-size: 0.8rem; }

        .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 25px; }
        .mode-card { background: rgba(35, 30, 45, 0.6); border: 1px solid #3a322a; border-radius: 6px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .mode-card:hover { border-color: var(--color-gold); background: rgba(45, 38, 58, 0.8); }
        .mode-card.active { border-color: var(--color-gold-bright); background: rgba(197, 168, 128, 0.12); box-shadow: 0 0 15px rgba(197, 168, 128, 0.2); }
        .mode-card i { font-size: 1.6rem; color: var(--color-gold); margin-bottom: 10px; }
        .mode-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; color: #fff; }
        .mode-desc { font-size: 0.78rem; color: #9e9282; line-height: 1.4; }

        .config-content-wrapper { min-height: 100px; margin-bottom: 25px; }
        .config-panel { display: none; }
        .config-panel.active { display: block; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 12px; color: #615649; }
        .magic-input { width: 100%; background: #16131c; border: 1px solid var(--color-border); border-radius: 4px; padding: 12px 12px 12px 38px; color: #fff; font-family: monospace; font-size: 0.95rem; outline: none; }
        
        .status-box { border-radius: 4px; padding: 15px; font-size: 0.85rem; line-height: 1.5; display: flex; align-items: flex-start; gap: 12px; }
        .status-success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; }
        .status-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #a8895f 0%, #735a38 100%); border: 1px solid var(--color-gold); color: #fff; padding: 14px; font-size: 1.05rem; font-weight: 600; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 2px; margin-bottom: 12px;}
        .btn-submit:hover:not(:disabled) { background: linear-gradient(135deg, #bfa47a 0%, #8c6e46 100%); box-shadow: 0 0 15px rgba(197, 168, 128, 0.4); }
        .btn-submit:disabled { background: #2a2520; border-color: #443c35; color: #665f55; cursor: not-allowed; box-shadow: none; }
        .btn-secondary { background: rgba(30, 25, 35, 0.8); border: 1px solid var(--color-border); color: var(--color-parchment); }
        .btn-secondary:hover:not(:disabled) { background: rgba(45, 38, 55, 0.9); border-color: var(--color-gold); color: #fff; }

        .config-select-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .select-group { background: rgba(20, 15, 25, 0.6); border: 1px solid var(--color-border); padding: 15px; border-radius: 4px; }
        .select-title { font-size: 0.9rem; color: var(--color-gold-bright); margin-bottom: 10px; font-weight: 600; }
        .radio-options { display: flex; flex-direction: column; gap: 10px; }
        .radio-label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; cursor: pointer; color: #b5a99a; transition: color 0.2s; }
        .radio-label:hover { color: #fff; }
        .radio-label input { accent-color: var(--color-gold); }

        .matrix-result-box { background: rgba(40, 32, 54, 0.4); border: 1px dashed var(--color-gold); border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .matrix-badge { display: inline-block; background: linear-gradient(135deg, #a8895f 0%, #735a38 100%); color: #fff; padding: 2px 10px; border-radius: 3px; font-size: 0.75rem; font-weight: bold; font-family: monospace; margin-bottom: 8px; }
        .matrix-text { font-size: 0.85rem; line-height: 1.5; color: var(--color-parchment); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav id="global-navbar" class="global-navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-hat-wizard"></i>
            <span>HOGWARTS LIFE</span>
        </div>
        <div class="nav-links">
            <a id="nav-dynamic-action" class="nav-item" onclick="handleNavbarAction()"><i class="fa-solid fa-folder-open"></i> 讀取存檔</a>
            <a id="nav-ai-config" class="nav-item" onclick="navToAIConfig()"><i class="fa-solid fa-robot"></i> 切換 AI</a>
        </div>
    </nav>

    <div id="stage-setup" class="game-stage setup-container active">
        <div class="header-section">
            <h1 class="game-title">MAGIC AWAKENED</h1>
            <p class="game-subtitle">─ AI 織路模組設定 ─</p>
            <div class="divider"><i>✦</i></div>
        </div>
        <div class="mode-options">
            <div class="mode-card active" id="mode-key-btn" onclick="switchMode('key')">
                <i class="fa-solid fa-key"></i>
                <div class="mode-title">自主串接模式</div>
                <div class="mode-desc">自備 Gemini API 金鑰，解鎖最高速的客製化體驗</div>
            </div>
            <div class="mode-card" id="mode-shell-btn" onclick="switchMode('shell')">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <div class="mode-title">App 免費外殼</div>
                <div class="mode-desc">透過手機外殼背景認證，免金鑰即開即玩</div>
            </div>
        </div>
        <div class="config-content-wrapper">
            <div class="config-panel active" id="panel-key">
                <div class="input-group">
                    <label class="input-label" for="api-key-input">請輸入您的 Google Gemini API Key :</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-bolt"></i>
                        <input type="password" id="api-key-input" class="magic-input" placeholder="AIzaSy..." autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="config-panel" id="panel-shell">
                <div id="shell-status" class="status-box"></div>
            </div>
        </div>
        <button id="start-game-btn" class="btn-submit" onclick="confirmSetup()">
            <span id="btn-text">確認模組設定</span>
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <div id="stage-menu" class="game-stage menu-container">
        <div class="header-section">
            <h1 class="game-title">命運選單</h1>
            <p class="game-subtitle">─ 選擇進入魔法世界的方式 ─</p>
            <div class="divider"><i>✦</i></div>
        </div>
        <div style="margin-top: 30px;">
            <button id="menu-continue-btn" class="btn-submit" onclick="continueGame()" style="display: none;">
                <i class="fa-solid fa-hourglass-start"></i> 繼續校園生活 (讀取自動存檔)
            </button>
            <button id="menu-new-btn" class="btn-submit btn-secondary" onclick="handleNewGame()">
                <i class="fa-solid fa-book-sparkles"></i> 開始全新校園生活
            </button>
        </div>
    </div>

    <div id="stage-world-config" class="game-stage">
        <div class="header-section">
            <h1 class="game-title">世界線編織</h1>
            <p class="game-subtitle">─ 設定開局敘事基礎矩陣 ─</p>
            <div class="divider"><i>✦</i></div>
        </div>

        <div class="config-select-section">
            <div class="select-group">
                <div class="select-title"><i class="fa-solid fa-book-open"></i> 1. 核心歷史事件流 (劇情線)</div>
                <div class="radio-options">
                    <label class="radio-label">
                        <input type="radio" name="timeline-mode" value="A" checked onchange="updateWorldMatrix()">
                        <span><strong>模式 A：包含原著主線事件</strong> (隨歷史軌跡推進玩家將捲入風暴)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="timeline-mode" value="B" onchange="updateWorldMatrix()">
                        <span><strong>模式 B：純 AI 生成原創事件</strong> (原著重大事件不發生，享受平行時空)</span>
                    </label>
                </div>
            </div>

            <div class="select-group">
                <div class="select-title"><i class="fa-solid fa-users-rectangle"></i> 2. 校園人物生成範圍 (角色庫)</div>
                <div class="radio-options">
                    <label class="radio-label">
                        <input type="radio" name="npc-mode" value="1" checked onchange="updateWorldMatrix()">
                        <span><strong>模式 1：完全比照原著角色</strong> (哈利、妙麗等經典人物)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="npc-mode" value="2" onchange="updateWorldMatrix()">
                        <span><strong>模式 2：原著角色 + 原創 AI 混搭</strong> (保留原著，同時偶遇 AI 新血)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="npc-mode" value="3" onchange="updateWorldMatrix()">
                        <span><strong>模式 3：僅教職員原著，學生全原創</strong> (教授不變，但同學全是新面孔)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="npc-mode" value="4" onchange="updateWorldMatrix()">
                        <span><strong>模式 4：全原創 NPC</strong> (純即興魔法校園，師生皆為全新存在)</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="matrix-result-box">
            <div id="matrix-badge" class="matrix-badge">世界線：A1</div>
            <div id="matrix-desc-text" class="matrix-text">載入中...</div>
        </div>

        <button class="btn-submit" onclick="saveWorldConfigAndNext()">
            <span>鎖定世界線，前進下一步驟</span>
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <div id="stage-purchase-config" class="game-stage">
        <div class="header-section">
            <h1 class="game-title">採買抉擇</h1>
            <p class="game-subtitle">─ 決定進入入學前夕的敘事深度 ─</p>
            <div class="divider"><i>✦</i></div>
        </div>

        <div class="config-select-section">
            <div class="select-group">
                <div class="select-title"><i class="fa-solid fa-bag-shopping"></i> 是否要完整體驗斜角巷採買與旅途？</div>
                <div class="radio-options">
                    <label class="radio-label">
                        <input type="radio" name="purchase-mode" value="yes" checked onchange="updatePurchaseRouteText()">
                        <span><strong>是，我想體驗一條龍入學</strong> (斜角巷魔杖探索、霍格華茲特快車、黑湖夜航)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="purchase-mode" value="no" onchange="updatePurchaseRouteText()">
                        <span><strong>否，我想直接極速快轉</strong> (跳過斜角巷與火車，直接黑幕開局站在大禮堂門前)</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="matrix-result-box">
            <div id="route-badge" class="matrix-badge" style="background: linear-gradient(135deg, #3b2d54 0%, #16131c 100%); border: 1px solid var(--color-gold);">預計分裂路線：路徑甲</div>
            <div id="route-desc-text" class="matrix-text">載入中...</div>
        </div>

        <button class="btn-submit" onclick="lockPurchaseConfigAndStart()">
            <span>儲存入學標籤，準備召喚 AI 織路</span>
            <i class="fa-solid fa-wand-sparkles"></i>
        </button>
    </div>

    <script>
        let currentMode = 'key'; 
        let isCapacitorAvailable = false;
        let gameState = 'setup'; 
        let prevGameState = 'setup'; 
        
        let worldLineConfig = { code: 'A1', timeline: 'A', npcScope: '1', narrativeLogic: '' };
        let purchaseRouteFlag = 'yes'; 

        const SAVE_KEY = 'rpg_game_save_data';

        const matrixMatrix = {
            'A1': "原著主線由原著角色依好感度級距自然將玩家捲入，可能隨機遭遇校園異象與暗線。",
            'A2': "原著主線由原著角色依好感度級距自然將玩家捲入，可能隨機遭遇校園異象與暗線。",
            'A3': "原著主線嚴格由教職員（固定原著設定）推動，學生社交圈全為原創角色。",
            'A4': "原著主線事件以「背景暗線」形式存在，無固定原著角色推動，由 AI 融入異象讓玩家自行探索捲入。",
            'B1': "原著角色僅作為具備原著性格的普通校園 NPC 存在，AI 暗線絕不指向任何原著重大事件。",
            'B2': "原著角色僅作為具備原著性格的普通校園 NPC 存在，AI 暗線絕不指向任何原著重大事件。",
            'B3': "教職員維持原著設定但絕不觸發主線，學生圈純原創，享受純粹的平行時校園生活。",
            'B4': "純原創魔法校園生活，所有暗線、師生、同學均為 AI 即興生成。"
        };

        document.addEventListener('DOMContentLoaded', () => {
            checkEnvironment();
            const savedKey = localStorage.getItem('user_gemini_api_key');
            if (savedKey) document.getElementById('api-key-input').value = savedKey;
            validateForm();
            document.getElementById('api-key-input').addEventListener('input', validateForm);
            updateWorldMatrix();
            updatePurchaseRouteText();
        });

        function checkEnvironment() {
            isCapacitorAvailable = !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser);
            updateShellPanelUI();
        }

        function updateShellPanelUI() {
            const statusBox = document.getElementById('shell-status');
            if (isCapacitorAvailable) {
                statusBox.className = "status-box status-success";
                statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i><div><strong>App 環境偵測成功！</strong><br>外殼自動認證已就緒。點擊按鈕將喚醒帶有控制條的登入視窗。</div>`;
            } else {
                statusBox.className = "status-box status-error";
                statusBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i><div><strong>此模式僅限在專屬 Android App 內使用</strong><br>當前處於一般瀏覽器環境，無法調用外殼憑證。請使用「自主串接模式」。</div>`;
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-key-btn').classList.toggle('active', mode === 'key');
            document.getElementById('mode-shell-btn').classList.toggle('active', mode === 'shell');
            document.getElementById('panel-key').classList.toggle('active', mode === 'key');
            document.getElementById('panel-shell').classList.toggle('active', mode === 'shell');
            document.getElementById('btn-text').innerText = (mode === 'shell') ? "開啟認證對話視窗" : "確認模組設定";
            validateForm();
        }

        function validateForm() {
            const startBtn = document.getElementById('start-game-btn');
            if (currentMode === 'key') {
                startBtn.disabled = (document.getElementById('api-key-input').value.trim().length < 10);
            } else {
                startBtn.disabled = !isCapacitorAvailable;
            }
        }

        async function confirmSetup() {
            if (currentMode === 'key') {
                localStorage.setItem('user_gemini_api_key', document.getElementById('api-key-input').value.trim());
                alert("✨ API 金鑰設定成功，魔力連結已建立！");
                handleSetupSuccess();
            } else if (currentMode === 'shell' && window.Capacitor?.Plugins?.Browser) {
                try {
                    // 【關鍵修正】：移除後置定時器與後置彈窗。
                    // 直接開啟自帶控制條/關閉按鈕的內嵌視窗，當玩家在對話視窗點擊「Done」或「關閉」時，立刻直覺切換回遊戲。
                    await window.Capacitor.Plugins.Browser.open({ 
                        url: 'https://gemini.google.com',
                        windowName: '_blank',
                        presentationStyle: 'popover' // 在 iOS/Android 強制開啟具備完成/切換按鈕的視窗
                    });
                    
                    // 只要視窗一開啟，便默認完成對齊，直接進入成功狀態，不使用任何干擾體驗的 Alert
                    handleSetupSuccess();
                } catch (err) { 
                    alert("喚醒外部視窗失敗：" + err); 
                }
            }
        }

        function handleSetupSuccess() {
            document.getElementById('global-navbar').style.display = 'flex';
            if (prevGameState && prevGameState !== 'setup') {
                changeStage(prevGameState);
            } else {
                changeStage('menu');
            }
        }

        function changeStage(targetStage) {
            gameState = targetStage;
            
            document.getElementById('stage-setup').classList.remove('active');
            document.getElementById('stage-menu').classList.remove('active');
            document.getElementById('stage-world-config').classList.remove('active');
            document.getElementById('stage-purchase-config').classList.remove('active');
            
            if (targetStage === 'setup') document.getElementById('stage-setup').classList.add('active');
            if (targetStage === 'menu') {
                document.getElementById('stage-menu').classList.add('active');
                checkAndRenderSaveOptions();
            }
            if (targetStage === 'world_config') document.getElementById('stage-world-config').classList.add('active');
            if (targetStage === 'purchase_config') document.getElementById('stage-purchase-config').classList.add('active');

            const navAction = document.getElementById('nav-dynamic-action');
            if (targetStage === 'menu') {
                navAction.innerHTML = `<i class="fa-solid fa-folder-open"></i> 讀取存檔`;
                checkAndRenderSaveOptions(); 
            } else {
                navAction.innerHTML = `<i class="fa-solid fa-house"></i> 回到主畫面`;
                navAction.classList.remove('disabled'); 
            }
        }

        function handleNavbarAction() {
            if (gameState === 'menu') {
                continueGame();
            } else {
                const leaveConfirm = confirm("🔮 是否要返回命運主選單？\n(未被鎖定的設定將不會被保存。)");
                if (leaveConfirm) changeStage('menu');
            }
        }

        function checkAndRenderSaveOptions() {
            if (gameState !== 'menu') return;
            const navAction = document.getElementById('nav-dynamic-action');
            const continueBtn = document.getElementById('menu-continue-btn');
            const rawData = localStorage.getItem(SAVE_KEY);
            let isSaveValid = false;

            if (rawData) {
                try {
                    const parsed = JSON.parse(rawData);
                    if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) isSaveValid = true;
                } catch (e) { isSaveValid = false; }
            }

            if (isSaveValid) {
                continueBtn.style.display = 'block';
                navAction.classList.add('disabled'); 
            } else {
                continueBtn.style.display = 'none';
                navAction.classList.remove('disabled');
            }
        }

        function handleNewGame() {
            const rawData = localStorage.getItem(SAVE_KEY);
            if (rawData) {
                const confirmOverwrite = confirm("🔮 命運之書提示：\n檢測到既存的校園生活刻印。開始新遊戲將徹底抹除舊數據，是否確認重新編織？");
                if (!confirmOverwrite) return;
                localStorage.removeItem(SAVE_KEY);
            }
            changeStage('world_config'); 
        }

        function continueGame() {
            alert("📖 正在載入歷史刻印，重返霍格華茲...");
        }

        function updateWorldMatrix() {
            const timeline = document.querySelector('input[name="timeline-mode"]:checked').value;
            const npc = document.querySelector('input[name="npc-mode"]:checked').value;
            const code = `${timeline}${npc}`;
            const desc = matrixMatrix[code] || "";
            
            document.getElementById('matrix-badge').innerText = `世界線代碼：${code}`;
            document.getElementById('matrix-desc-text').innerText = desc;

            worldLineConfig = { code: code, timeline: timeline, npcScope: npc, narrativeLogic: desc };
        }

        function saveWorldConfigAndNext() {
            changeStage('purchase_config');
        }

        function updatePurchaseRouteText() {
            const val = document.querySelector('input[name="purchase-mode"]:checked').value;
            const badge = document.getElementById('route-badge');
            const routeDescText = document.getElementById('route-desc-text');
            
            purchaseRouteFlag = val;

            if (val === 'yes') {
                badge.innerText = "預計分裂路線：【路徑甲：一條龍體驗】";
                routeDescText.innerHTML = `AI 將引導經歷三大經典里程碑：<br>
                <strong>1. 斜角巷採買：</strong> 自由探索並挑選購買專屬魔杖，回傳隱性學院傾向。<br>
                <strong>2. 霍格華茲特快車：</strong> 月台出發，於火車包廂建立最初人際關係。<br>
                <strong>3. 黑湖夜航：</strong> 跟隨海格乘船渡河，鋪陳入學震撼感。`;
            } else {
                badge.innerText = "預計分裂路線：【路徑乙：極速快轉】";
                routeDescText.innerHTML = `系統將跳過採買情境，通知 AI 以黑幕形式快轉。<br>
                故事開頭將直接聚焦於<strong>大禮堂的雙扇大門前</strong>，立即開始分院儀式。`;
            }
        }

        function lockPurchaseConfigAndStart() {
            alert(`✨ 新生入學標籤配置完成！\n
            1. 世界線：【${worldLineConfig.code}】
            2. 入學路徑：【${purchaseRouteFlag === 'yes' ? '路徑甲：一條龍' : '路徑乙：快轉大禮堂'}】\n
            [系統提示] 前端已成功將此開局環境標籤存檔緩存。現在可以開始呼叫 AI 模組，真正生成你的小說篇章了！`);
        }

        function navToAIConfig() {
            prevGameState = gameState; 
            changeStage('setup');
        }
    </script>
</body>
</html>
